[project]
name = "thinning"
version = "0.1.0"
description = "Code for the paper 'General progress substitutes for specific training data in language models'"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.12.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "numba==0.68.0",
    "chess==1.11.2",
    "zstandard==0.25.0",
    "pyarrow==26.0.0",
    "tokenizers==0.23.3",
]

[project.optional-dependencies]
webtext = [
    "transformers==5.19.0",
    "safetensors==0.8.0",
    "spacy==3.8.7",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
test = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thinning"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
